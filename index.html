<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>claude-prime</title>
  <style>
    :root {
      --bg: #faf9f6;
      --fg: #1f1e1d;
      --muted: #6b6965;
      --accent: #c96442;
      --card: #ffffff;
      --border: #e6e3dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1b19;
        --fg: #f2f0ea;
        --muted: #a29f97;
        --accent: #e0805f;
        --card: #262522;
        --border: #3a3834;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 96px 24px 48px;
    }
    h1 {
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      margin: 0 0 12px;
      letter-spacing: -0.03em;
    }
    h1 span { color: var(--accent); }
    .lead {
      font-size: 1.15rem;
      color: var(--muted);
      margin: 0 0 40px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    .card h2 { margin: 0 0 8px; font-size: 1.1rem; }
    .card p { margin: 0 0 16px; color: var(--muted); }
    .button {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .button:hover { opacity: 0.9; }
    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>claude<span>-prime</span></h1>
    <p class="lead">Mon premier projet GitHub.</p>

    <section class="card">
      <h2>Bienvenue</h2>
      <p>Cette page est le point de départ du projet. Elle est prête à être personnalisée avec votre contenu.</p>
      <a class="button" href="https://github.com/Mahamadou72/claude-prime">Voir le dépôt</a>
    </section>
  </main>

  <footer>© 2026 Mahamadou72</footer>
</body>
</html>
